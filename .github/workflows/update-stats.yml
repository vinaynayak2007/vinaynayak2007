name: Refresh stats cards

on:
  schedule:
    # runs daily at 03:00 UTC — keeps the cards current automatically
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stats-src/generate_stats.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate cards
        env:
          # STATS_TOKEN lets the script see private repos and private
          # contributions. Without it, the workflow falls back to the default
          # GITHUB_TOKEN and reports public data only.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: vinaynayak2007
          OUT_DIR: assets
          INCLUDE_PRIVATE: "1"
        run: python stats-src/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No changes — cards already current."
          else
            git commit -m "chore: refresh stats cards [skip ci]"
            git push
          fi
